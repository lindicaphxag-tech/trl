name: AsyncGRPO multi-turn policy provenance (CPU)
on:
  pull_request:
    paths:
      - "ci/async_grpo_multiturn_policy_contract.py"
      - "trl/experimental/async_grpo/async_rollout_worker.py"
      - ".github/workflows/async_grpo_multiturn_cpu.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multi-turn:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile production and source contract
        run: python -m py_compile trl/experimental/async_grpo/async_rollout_worker.py ci/async_grpo_multiturn_policy_contract.py
      - name: Run fork snapshot two-turn contract
        run: python ci/async_grpo_multiturn_policy_contract.py
      - name: Fetch pinned official current upstream source
        run: |
          git fetch --no-tags --depth=1 https://github.com/huggingface/trl.git 96a50e271db494a12336cfc60eb17429247c489f
          git show FETCH_HEAD:trl/experimental/async_grpo/async_rollout_worker.py > /tmp/trl_async_grpo_upstream.py
          git show FETCH_HEAD:trl/experimental/async_grpo/async_grpo_trainer.py > /tmp/trl_async_grpo_trainer_upstream.py
      - name: Execute identical fixture against official upstream source
        run: python ci/async_grpo_multiturn_policy_contract.py /tmp/trl_async_grpo_upstream.py /tmp/trl_async_grpo_trainer_upstream.py
