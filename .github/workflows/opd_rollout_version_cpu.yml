name: OPD rollout policy-version provenance CPU regression

on:
  pull_request:
    branches:
      - fix/async-opd-pin-rollout-sampling-policy-version-20261017
    paths:
      - ".github/workflows/opd_rollout_version_cpu.yml"
      - "trl/experimental/async_distillation/async_rollout_worker.py"
      - "tests/experimental/test_async_distillation_trainer.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-version-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Install TRL test dependencies
        run: python -m pip install -e ".[test]" requests ruff
      - name: Check production patch style
        run: |
          ruff check trl/experimental/async_distillation/async_rollout_worker.py tests/experimental/test_async_distillation_trainer.py
          ruff format --check trl/experimental/async_distillation/async_rollout_worker.py tests/experimental/test_async_distillation_trainer.py
      - name: Run offline request-version provenance regressions
        run: pytest -q tests/experimental/test_async_distillation_trainer.py::TestRolloutRequestModel
