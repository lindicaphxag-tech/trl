name: Digest-bound rollout admission (research)
on:
  push:
    branches:
      - research/verified-weight-admission-20261023
  workflow_dispatch:

jobs:
  provenance-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Deterministic positive and negative controls
        run: python -m unittest -v ci/weight_digest_admission_contract.py
