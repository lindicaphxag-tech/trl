name: Fork TRL Unicode model-card template
on:
  push:
    branches: [fix/model-card-template-explicit-utf8-20261015]
    paths:
      - trl/trainer/utils.py
      - tests/test_utils.py
      - .github/workflows/fork-trl-model-card-locale-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-card-utf8:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable TRL with genuine model-card dependencies
        run: python -m pip install -e . pytest
      - name: Test UTF-8 model-card under forced ASCII locale
        env:
          LC_ALL: C
          LANG: C
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
        run: |
          python -X utf8=0 - <<'PY'
          import locale
          print("Locale encoding:", locale.getpreferredencoding(False))
          assert locale.getpreferredencoding(False).lower() not in ("utf-8", "utf8")
          PY
          python -X utf8=0 -m pytest -q tests/test_utils.py::TestGenerateModelCard
