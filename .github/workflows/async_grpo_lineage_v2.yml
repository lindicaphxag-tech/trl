name: AsyncGRPO lineage contract (CPU)
on:
  pull_request:
    paths:
      - "ci/async_grpo_source_lineage_v2.py"
      - "trl/experimental/async_grpo/async_rollout_worker.py"
      - "tests/experimental/test_async_grpo_trainer.py"
      - ".github/workflows/async_grpo_lineage_v2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: python -m pip install numpy ruff==0.17.1
      - name: Compile production and regression sources
        run: |
          python -m py_compile trl/experimental/async_grpo/async_rollout_worker.py
          python -m py_compile tests/experimental/test_async_grpo_trainer.py
          python -m py_compile ci/async_grpo_source_lineage_v2.py
      - name: Ruff check and format only two upstream candidate files
        run: |
          ruff check trl/experimental/async_grpo/async_rollout_worker.py tests/experimental/test_async_grpo_trainer.py
          ruff format --check trl/experimental/async_grpo/async_rollout_worker.py tests/experimental/test_async_grpo_trainer.py
      - name: Run patched production-source lineage and queue test
        run: python ci/async_grpo_source_lineage_v2.py
      - name: Get pinned unchanged official upstream main
        run: |
          git fetch --no-tags --depth=1 https://github.com/huggingface/trl.git ea8cb1b57bd29da6deb1fc2ee9f1f8ff77c7038e
          git show FETCH_HEAD:trl/experimental/async_grpo/async_rollout_worker.py > /tmp/orig_async_grpo_worker.py
          git show FETCH_HEAD:trl/experimental/async_grpo/async_grpo_trainer.py > /tmp/orig_async_grpo_trainer.py
      - name: Run negative-control official producer and official consumer
        run: python ci/async_grpo_source_lineage_v2.py /tmp/orig_async_grpo_worker.py /tmp/orig_async_grpo_trainer.py --baseline
